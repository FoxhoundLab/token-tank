<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Token Tank</title>
    <style>
        body {
            width: 340px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0805;
            color: #f2e7d4;
        }
        h1 { font-size: 1.05rem; margin: 0 0 4px 0; }
        .sub { font-size: 0.75rem; color: #c9a468; margin-bottom: 12px; }
        .status {
            padding: 8px 10px;
            background: #14100a;
            border: 1px solid #2a2114;
            margin: 8px 0;
        }
        .label {
            font-size: 0.68rem;
            color: #c9a468;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
        .value { font-size: 0.82rem; margin: 3px 0; line-height: 1.35; }
        .value.ok { color: #f2e7d4; }
        .value.warn { color: #e8b94a; }
        .value.idle { color: #6e5731; }
        .note { font-size: 0.68rem; color: #8a7550; margin-top: 2px; line-height: 1.3; }
        .note.warn { color: #e8b94a; }
        .footer { font-size: 0.7rem; color: #6e5731; margin-top: 12px; line-height: 1.4; }
        a { color: #c99b4e; text-decoration: none; }
        #sync-now {
            width: 100%;
            margin-top: 10px;
            padding: 7px 0;
            background: none;
            border: 1px solid #c99b4e;
            color: #c99b4e;
            font-family: inherit;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            cursor: pointer;
        }
        #sync-now:hover { background: #c99b4e; color: #0a0805; }
        #sync-now-result { min-height: 1em; margin-top: 6px; }
    </style>
</head>
<body>
    <h1>Token Tank</h1>
    <div class="sub">Subscription cap tracker</div>

    <div id="providers">
        <div class="status"><div class="value idle">Loading…</div></div>
    </div>

    <button id="sync-now">SYNC NOW</button>
    <div class="note" id="sync-now-result"></div>

    <div class="footer">
        Syncs to <code>localhost:8080</code>.
        <br><a href="http://localhost:8080" target="_blank">Open Mission Control →</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
